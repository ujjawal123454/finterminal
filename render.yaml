services:
  - type: web
    name: finterminal
    runtime: python
    region: singapore
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KOTAK_CONSUMER_KEY
        sync: false
      - key: KOTAK_CONSUMER_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
