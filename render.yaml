services:
  - type: web
    name: finterminal
    runtime: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KOTAK_CONSUMER_KEY
        sync: false
      - key: KOTAK_CONSUMER_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
